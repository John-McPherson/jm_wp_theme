name: Playwright E2E

on:
  pull_request:
  push:
    branches:
      - main
      - dev
      - 21-implement-header-structure-and-site-identity

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: WordPress E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: true
      WP_BASE_URL: http://localhost:8888
      WP_USERNAME: admin
      WP_PASSWORD: password
      WP_ENV_CORE: WordPress/WordPress#master
      THEME_SLUG: jm_wp_theme

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build theme
        run: npm run build

      - name: Destroy stale WordPress environment
        run: npx wp-env destroy || true

      - name: Start WordPress
        run: npm run env:start

      - name: Wait for WordPress
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent "${WP_BASE_URL}" >/dev/null; then
              echo "WordPress is ready"
              exit 0
            fi

            echo "Waiting for WordPress (${attempt}/30)..."
            sleep 2
          done

          echo "WordPress did not become ready"
          docker ps --all
          npx wp-env logs || true
          exit 1

      - name: Show environment versions
        run: |
          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"
          npx wp-env run cli wp core version
          npx wp-env run cli wp theme list

      - name: Verify WordPress 7.1 or newer
        shell: bash
        run: |
          WORDPRESS_VERSION="$(
            npx wp-env run cli wp core version |
            tail -n 1 |
            tr -d '\r'
          )"

          echo "WordPress version: ${WORDPRESS_VERSION}"

          if ! npx wp-env run cli php -r "
            exit(
              version_compare(
                '${WORDPRESS_VERSION}',
                '7.1',
                '>='
              ) ? 0 : 1
            );
          "; then
            echo "WordPress 7.1 or newer is required."
            exit 1
          fi

      - name: Activate custom theme
        run: |
          npx wp-env run cli wp theme activate "${THEME_SLUG}"
          npx wp-env run cli wp theme status "${THEME_SLUG}"

      - name: Verify active theme
        shell: bash
        run: |
          ACTIVE_THEME="$(
            npx wp-env run cli wp option get stylesheet |
            tail -n 1 |
            tr -d '\r'
          )"

          echo "Expected theme: ${THEME_SLUG}"
          echo "Active theme: ${ACTIVE_THEME}"

          if [ "${ACTIVE_THEME}" != "${THEME_SLUG}" ]; then
            echo "The expected theme is not active."
            npx wp-env run cli wp theme list
            exit 1
          fi

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures-${{ github.run_id }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Show WordPress logs
        if: ${{ failure() }}
        run: npx wp-env logs || true

      - name: Stop WordPress
        if: ${{ always() }}
        run: npm run env:stop || true
