name: Playwright E2E

on:
  pull_request:
  push:
    branches:
      - main
      - dev

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: WordPress E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: true
      WP_BASE_URL: http://localhost:8888
      WP_USERNAME: admin
      WP_PASSWORD: password

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build theme
        run: npm run build

      - name: Start WordPress
        run: npm run env:start

      - name: Wait for WordPress
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8888 >/dev/null; then
              exit 0
            fi

            sleep 2
          done

          echo "WordPress did not become ready"
          docker ps --all
          exit 1

      - name: Run Playwright
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures-${{ github.run_id }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Show WordPress logs
        if: ${{ failure() }}
        run: npx wp-env logs
