name: Quality checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        # The supported floor (composer.json / style.css) and the newest stable
        # release, as set out in docs/support.md.
        php:
          - "8.3"
          - "8.5"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-

      - name: Install locked Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Lint PHP syntax
        run: |
          find . -type f -name "*.php" \
            -not -path "./node_modules/*" \
            -not -path "./vendor/*" \
            -not -path "./build/*" \
            -not -path "./dist/*" \
            -print0 | xargs -0 -n1 php -l

      - name: Check PHP coding standards
        run: vendor/bin/phpcs

      - name: Run PHP tests
        run: composer test

  node:
    name: Type-check, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      # `package` generates the translation template with WP-CLI's i18n command.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none

      - name: Install locked Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run Vitest unit tests with coverage
        run: npm run test:unit:coverage

      # Reported to follow the trend; there is no threshold yet.
      - name: Summarise coverage
        if: ${{ !cancelled() }}
        run: |
          node -e '
          const fs = require( "fs" );
          const file = "artifacts/coverage/coverage-summary.json";
          if ( ! fs.existsSync( file ) ) process.exit( 0 );
          const { total } = JSON.parse( fs.readFileSync( file, "utf8" ) );
          const rows = [ "statements", "branches", "functions", "lines" ]
            .map( ( key ) => `| ${ key } | ${ total[ key ].pct }% | ${ total[ key ].covered }/${ total[ key ].total } |` );
          console.log( [ "### JavaScript unit test coverage", "", "| Metric | Coverage | Covered |", "| --- | --- | --- |", ...rows ].join( "\n" ) );
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage-${{ github.run_id }}
          path: artifacts/coverage/
          retention-days: 14
          if-no-files-found: ignore

      - name: Type-check
        run: npm run typecheck

      - name: Lint JavaScript and TypeScript
        run: npm run lint:js

      - name: Lint styles
        run: npm run lint:styles

      # `package` runs `build` first, so the theme is built once.
      - name: Build release package
        run: npm run package

      - name: Verify packaged theme
        run: |
          test -f dist/functions.php
          test -f dist/style.css
          test -f dist/theme.json
          test -d dist/styles/colors
          test -f dist/build/css/style.css
          test -d dist/build/js
          test -d dist/inc
          test -d dist/components
          test -d dist/templates
          test -d dist/parts
          test -f dist/parts/header.html
          test -f dist/patterns/hero.php
          test -s dist/languages/jmc-theme.pot
