name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Install, type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2
          coverage: none

      - name: Install locked Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHP tests
        run: composer test

      - name: Type-check
        run: npm run typecheck

      - name: Lint PHP syntax
        run: npm run lint:php

      - name: Lint JavaScript and TypeScript
        run: npm run lint:js

      - name: Lint styles
        run: npm run lint:styles

      - name: Check PHP coding standards
        run: npm run lint:phpcs

      - name: Build theme
        run: npm run build

      - name: Build release package
        run: npm run package

      - name: Verify packaged theme
        run: |
          test -f dist/functions.php
          test -f dist/style.css
          test -f dist/theme.json
          test -f dist/build/css/style.css
          test -d dist/build/js
          test -d dist/inc
          test -d dist/components
          test -d dist/templates
          test -d dist/parts
          test -f dist/parts/header.html
